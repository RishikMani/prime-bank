name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: action/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      
      - name: Set up Python
        run: uv python install 3.14
      
      - name: Install Dependencies
        run: uv sync --locked
      
      - name: Run Tests
        run: |
          python manage.py test
